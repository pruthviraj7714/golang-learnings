
syntax = "proto3"

package user;

option go_package = "day-30-grpc/pb"

service UserService {
    rpc CreateUser(CreateUserRequest)
        returns (UserResponse);
}

message CreateUserRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message User {
    int32 id = 1;
    string name = 2;
    string email = 3;
    string password = 4;
}

message UserResponse {
    User user = 1
}
